plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace "com.kia.blagogramapp"
    compileSdk 34

    defaultConfig {
        applicationId "com.kia.blagogramapp"
        minSdk 23
        targetSdk 34
        versionCode 4
        versionName "0.3.0-beta"
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.10"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.10.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
    implementation "io.coil-kt:coil:2.2.2"
    implementation "com.github.Commit451:coil-transformations:2.0.2"
    implementation "androidx.palette:palette-ktx:1.0.0"
    
    // Для зума картинок при просмотре
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    // Для редактирования (кроп, поворот)
    implementation 'com.github.yalantis:ucrop:2.2.8'
    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")
    implementation "androidx.cardview:cardview:1.0.0"
    
    // Библиотека для отображения iOS смайликов
    implementation 'com.vanniktech:emoji-ios:0.16.0'

    // Библиотека для медиа-уведомлений
    implementation 'androidx.media:media:1.7.0'
}
